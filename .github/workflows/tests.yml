name: Tests

on:
  push:
    branches:
      - '**'
      - '!master'
    tags-ignore:
      - '**'

jobs:
  tests:
    uses: djachenko/repokit/.github/workflows/python-tests.yml@0.11
    secrets: inherit

  python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[test]"

      - run: pytest
